<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" href="img/icon-192.png">
<title>星汇 · 明星动态聚合</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#26262a; --ink2:#7c7c85; --ink3:#a9a9b2;
    --line:rgba(0,0,0,.07); --accent:#3a4a8c;
    --wb:#e6162d; --dy:#161823;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 移动端布局基准：以手机屏幕宽度为基准，禁止横滚与页面缩放，滚动完全交给内部 .view */
  html,body{height:100%;width:100%;max-width:100vw;overflow:hidden;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  body{
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center;
  }
  .phone{width:100%;max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);
    position:relative;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- views ---------- */
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);touch-action:pan-y;
    transform:translateX(100%);transition:transform .32s cubic-bezier(.3,.8,.3,1);opacity:0;pointer-events:none;
    display:flex;flex-direction:column;
    -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
    padding-bottom:env(safe-area-inset-bottom)}
  /* 关键：禁止 flex 子项被压缩，否则内容超出一屏时会被压扁、导致页面滚不动 */
  .view > *{flex:0 0 auto}
  .view.active{transform:translateX(0);opacity:1;pointer-events:auto;z-index:2}
  .view.under{transform:translateX(-18%);opacity:.4;z-index:1}
  .view-root{transform:translateX(0);opacity:1;pointer-events:auto}
  /* 系统返回交由手机原生导航手势 / 返回键处理，不再有自定义边缘箭头与提示条 */

  /* ---------- home ---------- */
  .home-head{position:relative;padding:34px 22px 14px}
  /* 首页右上角小红点：离开期间有新动态时出现，点一下看新帖即消失 */
  .hb-dot{position:absolute;top:30px;right:18px;min-width:20px;height:20px;padding:0 6px;border:0;
    border-radius:11px;background:#e23b3b;color:#fff;font-size:12px;font-weight:700;line-height:20px;
    cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.28);font-family:inherit}
  .hb-dot[hidden]{display:none}
  .home-sub{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink3)}
  .home-sub .lnk{background:none;border:0;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;font-family:inherit}
  .home-head h1{font-size:28px;font-weight:800;letter-spacing:1px;display:inline-block;
    background:linear-gradient(120deg,#3a4a8c,#7a5cc9 55%,#c05a8e);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .home-head p{font-size:13px;color:var(--ink2);margin-top:5px;letter-spacing:.04em}
  .star-list{padding:8px 18px 110px;display:flex;flex-direction:column;gap:14px}
  .star-card{
    background:var(--card);border-radius:var(--radius);padding:16px 16px;
    display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(30,35,60,.04);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:rise .45s cubic-bezier(.25,.8,.3,1) both;
  }
  .star-card:nth-child(2){animation-delay:.06s}
  .star-card:active{transform:scale(.975)}
  .star-card:hover{box-shadow:0 6px 18px rgba(30,35,60,.10)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .avatar{width:64px;height:64px;border-radius:20px;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:26px;font-weight:700;letter-spacing:1px;background:#e8e7f2}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar-hmh{background:linear-gradient(135deg,#5a6fd6,#38457f)}
  .avatar-lyx{background:linear-gradient(135deg,#d67a9a,#8c3a5a)}
  .star-info{flex:1;min-width:0}
  .star-name{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
  .badge-soon{font-size:10px;color:var(--ink2);background:rgba(0,0,0,.06);border-radius:20px;padding:2px 7px}
  .star-meta{font-size:12px;color:var(--ink2);margin-top:6px}
  .star-latest{font-size:12px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--ink3);font-size:20px;flex-shrink:0}
  .dot-badge{position:absolute;top:12px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--wb)}

  /* ---------- bottom nav ---------- */
  .tabbar{position:sticky;bottom:0;width:100%;margin-top:auto;/* margin-top:auto：内容不满一屏时也压到视口底部 */
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .tab{flex:1;text-align:center;padding:9px 0 10px;cursor:pointer;color:var(--ink3);font-size:10.5px;user-select:none}
  .tabbar .tab svg{display:block;margin:0 auto 3px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .tab.on{color:var(--accent);font-weight:600}

  /* ---------- detail ---------- */
  .d-head{position:sticky;top:0;z-index:4;background:rgba(246,245,242,.9);backdrop-filter:blur(14px);
    display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .back{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
  .back:active{transform:scale(.92)}
  .back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .d-title{font-size:17px;font-weight:700}
  .d-sub{font-size:11px;color:var(--ink2);margin-top:1px}
  .d-body{padding:12px 16px 40px;display:flex;flex-direction:column;gap:10px;min-width:0;max-width:100%}

  /* 实时数据状态条 */
  .live-bar{display:flex;align-items:center;gap:7px;padding:9px 12px;margin-bottom:10px;
    background:#f4f7ff;border:1px solid #e2e9fb;border-radius:12px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;
    box-shadow:0 0 0 3px rgba(34,197,94,.16);animation:pulse 2s infinite}
  .live-dot.off{background:#c3c8d2;box-shadow:none;animation:none}
  .live-txt{flex:1;font-size:11px;color:#5b6478;line-height:1.4}
  .live-btn{border:none;background:var(--accent);color:#fff;font-size:11px;padding:5px 11px;
    border-radius:14px;cursor:pointer;font-family:inherit;flex-shrink:0}
  .live-btn:active{transform:scale(.94)}
  .acct-strip{display:flex;gap:8px;margin:0 16px 0}

  .acct-item{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:6px 6px;text-align:center;cursor:pointer;transition:transform .15s, box-shadow .15s}
  .acct-item:active{transform:scale(.95)}
  .acct-item:hover{box-shadow:0 4px 12px rgba(30,35,60,.08)}
  .acct-item .a-p{font-size:11px;font-weight:600}
  .acct-item .a-id{font-size:10.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct-item .a-open{font-size:9.5px;color:var(--accent);margin-top:1px;font-weight:500}
  .acct-item{text-decoration:none}
  .p-weibo{color:var(--wb)}

  /* 筛选区：只剩相关账号区的账号筛选行（2026-10-18 删平台筛选，仅剩微博无筛选意义） */
  .filter-tabs{display:flex;gap:8px;padding:0 2px;flex-wrap:wrap}
  /* 账号行：相关账号区的账号筛选，弱化标签 + 缩进 */
  .acct-row{display:flex;align-items:flex-start;gap:9px;margin:8px 2px 0;
    padding-left:2px;border-left:2px solid rgba(58,74,140,.18);padding-left:10px}
  .acct-row-label{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.04em;
    flex-shrink:0;padding:3px 0;white-space:nowrap}
  .acct-row .acct-tabs{gap:7px}
  .acct-row .ftab{padding:5px 12px;font-size:12px;border-radius:14px}
  .ftab{padding:6px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);
    font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
  .ftab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .p-main{display:flex;gap:10px;align-items:flex-start}
  .p-body{flex:1;min-width:0}
  a.jump{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--accent);
    font-weight:500;text-decoration:none;font-size:11.5px;white-space:nowrap}
  a.jump svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* 已读按钮 */
  .read-btn{border:none;background:rgba(0,0,0,.06);color:var(--ink2);font-size:11.5px;
    padding:5px 12px;border-radius:14px;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0}
  .read-btn.done{background:rgba(58,74,140,.12);color:var(--accent);font-weight:600}
  .read-btn:active{transform:scale(.94)}
  .read-note{padding:8px 14px;font-size:11px;color:var(--ink3);background:#fbfbfa;
    border-top:1px dashed var(--line);text-align:center}
  .empty-sm{padding:18px;text-align:center;color:var(--ink3);font-size:12px;
    background:#fbfbfa;border:1px dashed rgba(0,0,0,.1);border-radius:12px}

  .sec-label{display:flex;align-items:center;gap:8px;padding:0 2px}
  .sec-label .bar{width:4px;height:16px;border-radius:3px;background:var(--accent)}
  .sec-label h2{font-size:15.5px;font-weight:700}
  .sec-label span{font-size:11.5px;color:var(--ink3)}

  .own-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(30,35,60,.04);overflow:hidden;min-width:0;max-width:100%}
  .post{padding:14px 14px 12px;position:relative;cursor:pointer;transition:background .15s}
  .post:hover{background:#fafafa}
  .post:active{background:#f4f4f6}
  .post + .post{border-top:1px solid var(--line)}
  .p-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,22,45,.35)}50%{box-shadow:0 0 0 4px rgba(230,22,45,0)}}
  .p-account{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .p-tag{font-size:10px;color:var(--ink2);background:rgba(0,0,0,.05);padding:1.5px 6px;border-radius:12px;white-space:nowrap;flex-shrink:0}
  .p-src{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:14px;color:#fff;white-space:nowrap;flex-shrink:0}
  .src-weibo{background:var(--wb)} .src-dy{background:var(--dy)}
  .p-src svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .p-text{font-size:14px;line-height:1.62;color:#333338;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word}
  .p-pics{display:flex;gap:6px;margin-top:9px}
  .ph{flex:1;aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden}
  .ph svg{position:absolute;right:7px;bottom:6px;width:15px;height:15px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .vbadge{position:absolute;left:7px;bottom:6px;font-size:10px;font-weight:600;color:#fff;
    background:rgba(22,24,35,.72);padding:2px 7px;border-radius:12px}
  .ph-1{background:linear-gradient(135deg,#c7d3f2,#8fa3dd)}
  .ph-2{background:linear-gradient(135deg,#f2d4c7,#dda08f)}
  .ph-3{background:linear-gradient(135deg,#d4f2cf,#93c98c)}
  .ph-4{background:linear-gradient(135deg,#e8d1f0,#b78ac9)}
  .ph-real{background:linear-gradient(135deg,#eef0f5,#dfe3ec)}
  /* 封面占位：按平台品牌色区分，保证微博卡片的信息密度与观感一致 */
  .ph-weibo{background:linear-gradient(135deg,#f4d6d8,#cf9097)}
  .ph-tip{position:absolute;left:7px;top:7px;font-size:9.5px;color:#fff;background:rgba(0,0,0,.3);
    padding:1.5px 6px;border-radius:10px;letter-spacing:.3px}
  /* 作者头像（微博统一） */
  .p-av{width:26px;height:26px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:12.5px;font-weight:700}
  .av-weibo{background:linear-gradient(135deg,#f4595b,#c2141f)}
  .p-title{font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:3px;
    overflow-wrap:anywhere;word-break:break-word}
  /* 互动数据行（转发 / 评论 / 点赞）：缺省显示 —，微博排版一致 */
  .p-stats{display:flex;align-items:center;gap:14px;margin-top:9px;font-size:11.5px;color:var(--ink3)}
  .p-stats .st{display:inline-flex;align-items:center;gap:4px}
  .p-stats .st svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .p-foot{display:flex;align-items:center;margin-top:9px;font-size:11.5px;color:var(--ink3)}
  .p-foot .open{margin-left:auto;display:flex;align-items:center;gap:3px;color:var(--accent);font-weight:500}
  .p-foot .open svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .rel-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(30,35,60,.04);overflow:hidden}
  .rel-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#fbfbfc}
  .rel-head .mini-av{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#7a88c9,#4d5a99);
    color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .rel-head b{font-size:13px}
  .rel-head span{font-size:11px;color:var(--ink3);margin-left:auto}
  .rel-row{padding:13px 14px;position:relative;cursor:pointer;transition:background .15s}
  .rel-row:hover{background:#fafafa}
  .rel-row:active{background:#f4f4f6}
  .rel-row + .rel-row{border-top:1px solid var(--line)}
  .rel-row .p-text{font-size:13px;color:#4b4b52}
  .rel-row .p-foot{margin-top:7px}

  .empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:13px;background:var(--card);
    border:1px dashed rgba(0,0,0,.12);border-radius:var(--radius)}

  /* ---------- mine ---------- */
  .mine-head{padding:44px 22px 20px;text-align:center}
  .mine-av{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,#3a4a8c,#222c56);
    color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:2px}
  .mine-head h2{font-size:18px}
  .mine-head p{font-size:12px;color:var(--ink2);margin-top:4px}
  .mine-list{margin:0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .m-row{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:14.5px;cursor:pointer}
  .m-row + .m-row{border-top:1px solid var(--line)}
  .m-row:active{background:#f6f6f8}
  .m-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .m-ic svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .m-row .sub{margin-left:auto;font-size:12px;color:var(--ink3)}
  .mine-note{padding:20px 30px;text-align:center;font-size:11px;color:var(--ink3);line-height:1.7}

  /* ---------- 图片管理 ---------- */
  .sec-title{margin:14px 20px 8px;font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.5px;
    display:flex;align-items:center;gap:7px}
  .sec-title::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--accent)}
  .img-card{margin:0 18px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;display:flex;align-items:center;gap:13px}
  .img-thumb{width:66px;height:66px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#eceaf0}
  .img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .img-info{flex:1;min-width:0}
  .img-info b{font-size:14.5px}
  .img-info .img-status{font-size:11px;color:var(--ink3);margin-top:4px}
  .img-btn{flex-shrink:0;border:none;outline:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;
    padding:8px 14px;border-radius:18px;cursor:pointer;transition:transform .15s,opacity .15s;font-family:inherit}
  .img-btn:active{transform:scale(.94)}
  .img-btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(58,74,140,.35)}

  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);background:rgba(30,30,36,.9);
    color:#fff;font-size:12.5px;padding:9px 16px;border-radius:22px;opacity:0;pointer-events:none;
    transition:all .25s ease;z-index:99;max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 首页：入口卡片靠顶部展示（不垂直居中），内容超过一屏时正常滚动；
     Tab 栏由 margin-top:auto 压到视口底部，这里无需再留大内边距 */
  #view-home .star-list{flex:0 0 auto;padding-bottom:12px}
  /* 我的页：底部 Tab 已改为吸底占位元素，这里只留少量收尾留白（不要加大内边距，否则 Tab 无法贴底） */
  #view-mine{padding-bottom:0}
  #view-star .d-body{padding-bottom:96px}

  /* 图片加载失败兜底：保留占位块而非空白 */
  .ph.imgfail{background:linear-gradient(135deg,#e9ecf3,#d7dbe6)}
  .ph.imgfail img{display:none}
  .ph.imgfail::after{content:'图片加载失败';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8a8f99}
  /* 视频封面中央播放按钮 */
  .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;pointer-events:none}
  .vplay svg{width:18px;height:18px;fill:#fff;margin-left:2px}
  /* 整体折叠：分区折叠占位条（默认全部隐藏时显示） */
  .fold-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;margin:6px 0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;cursor:pointer}
  .fold-bar:active{background:#f4f4f6}
  .fold-bar-txt{font-size:13px;color:var(--ink2)}
  .fold-bar-btn{font-size:13px;font-weight:700;color:var(--accent)}
  /* 收起全部 */
  .fold-collapse{text-align:center;font-size:12.5px;font-weight:600;color:var(--accent);
    padding:10px;margin:8px 0 2px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;cursor:pointer}
  .fold-collapse:active{background:#f4f4f6}

/* encodeURIComponent 遇到「被按 UTF-16 单元切半的 emoji」（残缺代理对）会抛

   编不了的坏字符直接丢弃，保证永不抛错。 */
function safeEncode(s){
  try { return encodeURIComponent(s); }
  catch(e){
    let out = '';
    for (const ch of String(s)){          /* for..of 按完整码点遍历 */
      try { out += encodeURIComponent(ch); } catch(e2){ /* 跳过残缺字符 */ }

const MAX_AGE_DAYS = 180;

}

  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ` +
         `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;

  if (isNew(t)){
    const h = d.getHours().toString().padStart(2,'0'), m = d.getMinutes().toString().padStart(2,'0');
    return `今天 ${h}:${m}`;

  /* 跨年份的帖子补上年份，避免「4月30日」看不出是哪一年 */
  const sameYear = d.getFullYear() === n.getFullYear();

   - 分区（本人 / 相关账号）默认整体折叠：已读帖全部隐藏，只留一条占位条。
   - readSet：已读帖 UID 集合（持久化到 localStorage）。
   - 未读帖（新帖 / 取消已读的帖）始终完整展开显示，不受整体折叠影响 →「新帖默认不折叠」。
   - 启动时把当时全部帖标为已读（ensureStartupSnap，快照只捕获一次并持久化标记），
     所以「现有帖子默认折叠」；之后用户「取消已读」的选择跨刷新仍保持展开。
   - 点某帖「标记已读」→ 加入 readSet → 该帖进入折叠区（隐藏）；

/* ===== 分享版开关（URL 带 ?share=1）=====
   仅「分享出去的安装包」内置该参数（见 apkbuild/build.ps1 -Share）：
   · 打开即把全部帖子视为已读 → 全部折叠，首屏清爽不凌乱；
   · 已读记录写独立键 starhub_read_share，不碰正常键 starhub_read，也不落 SNAP 锁定标记

const SHARE_MODE = /(?:^|[?&])share=1(?:&|$)/.test(location.search);

const READ_KEY = SHARE_MODE ? 'starhub_read_share' : 'starhub_read';
const SNAP_KEY = 'starhub_snap_done';
const readSet = new Set((()=>{ try{ return JSON.parse(store.getItem(READ_KEY) || '[]'); }catch(e){ return []; } })());
function saveRead(){ try{ store.setItem(READ_KEY, JSON.stringify([...readSet])); }catch(e){} }
function toggleRead(uid){
  if (readSet.has(uid)){ readSet.delete(uid); if (SHARE_MODE) SHARE_UNREAD.add(uid); }
  else { readSet.add(uid); SHARE_UNREAD.delete(uid); }                 /* 取消已读 / 标记已读 */
  revealed.own.delete(uid); revealed.rel.delete(uid);                 /* 折叠区里若有它，一并清掉，避免残留展开态 */

let revealed = { own:new Set(), rel:new Set() };   /* 折叠区里被「展开 N 条」放出来的已读帖，仅本会话有效 */
let STARTUP_UIDS = new Set();                       /* 启动时就存在的帖子，已标为已读 */
let startupDone = (store.getItem(SNAP_KEY) === '1'); /* 启动快照只捕获一次（持久化，仅针对真实数据） */
function ensureStartupSnap(){
  let hasReal = false;
  (DATA.stars || []).forEach(s=>{
    const d = DATA[s.id];
    if (d && (d.own.concat(d.related).some(p => p._uid && String(p._uid).indexOf('demo_') !== 0))) hasReal = true;
  });
  if (SHARE_MODE){
    /* 分享版：每次数据刷新都把全部帖标为已读（手动取消已读的除外），且不落锁定标记 */
    (DATA.stars || []).forEach(s=>{
      const dd = DATA[s.id]; if (!dd) return;
      dd.own.concat(dd.related).forEach(p=>{ if (!SHARE_UNREAD.has(p._uid)) readSet.add(p._uid); });
    });
    saveRead();
    return;
  }
  /* 真实数据快照已完成 → 锁定：之后轮询新抓到的帖保持未读（默认不折叠） */
  if (startupDone && hasReal) return;
  (DATA.stars || []).forEach(s=>{
    const dd = DATA[s.id]; if (!dd) return;
    dd.own.concat(dd.related).forEach(p=>{
      if (!STARTUP_UIDS.has(p._uid)){ STARTUP_UIDS.add(p._uid); readSet.add(p._uid); }
    });
  });
  saveRead();
  /* 仅当当前数据已是真实数据时才落下锁定标记；demo 占位阶段不锁定，等真实数据到达后重做 */
  if (hasReal){ startupDone = true; try{ store.setItem(SNAP_KEY, '1'); }catch(e){} }

/* ================= 首页右上角小红点（未读新帖） =================

   · hbSeen = 用户「最后一次确认看过新帖」的时刻（localStorage 持久化，跨重启保留）；
   · 只要存在发布时间 > hbSeen 的帖 → 右上角红点出现并显示未读数量（不依赖离开 App）；
   · 点红点 → 跳到最新新帖所在明星时间线，同时 hbSeen 刷新为当下 → 红点立即消失；
   · 明星卡右上角小圆点（.dot-badge）同用这套逻辑：该明星有未读新帖才显示。
   注意：hbSeen 只在「点红点确认」时前进；页面 60 秒轮询 / 切后台 / 切视图都不再自动清除，
   因此新帖采到后稳定可见，不会再被轮询「顶掉」（这是此前红点永不亮的根因）。 */
const HB_KEY = SHARE_MODE ? 'starhub_hb_seen_share' : 'starhub_hb_seen';
let hbSeen = (()=>{
  try{ const v = Number(store.getItem(HB_KEY)); if (v > 0) return v; }catch(e){}
  const now = Date.now();                   /* 首次打开：把已有帖都算「已看过」，不打红点 */
  try{ store.setItem(HB_KEY, String(now)); }catch(e){}
  return now;
})();
function hbTouch(){
  hbSeen = Date.now();

}
function hbNewest(){
  /* 返回发布时间最新、且晚于 hbSeen 的帖（不存在则 null） */
  let best = null;

    const d = DATA[s.id]; if (!d) return;
    d.own.concat(d.related).forEach(p=>{
      const t = Number(p.time) || 0;
      if (t > hbSeen && (!best || t > best.t)) best = { t, star: s.id };
    });

  return best;
}
function hbUnseenCount(){

/* ================= 系统级返回（接入手机原生导航手势 / 返回键） =================
   不再自行实现 App 内右滑手势，改为由设备系统负责返回：
     · 进入子页面（明星详情 / 我的）时 push 一条 History 状态，WebView 历史栈随之增长；
     · 系统返回（Android 返回键或边缘手势、iOS 右滑边缘返回）触发 WebView.goBack()
       → 浏览器 popstate → 此处按状态还原上一页，与系统行为完全一致；
     · 已在首页时 WebView 无历史，原生直接 finish() 退出 App。
   本方案不使用任何自定义触摸 / 指针监听，绝不与系统手势争抢，也不会出现“假返回”。 */

/* 按状态切换视图（被 navigate 与 popstate 共用） */
function showView(view, extra){
  /* 小红点时机记录：离开首页的一瞬间刷新 seen（之后到的新帖都算「离开期间」） */
  const curEl = document.querySelector('.view.active');
  if (view === 'star'){
    const id = (extra && extra.star) || curStar;
    curStar = id; curRelFilter = 'all';
    revealed = { own:new Set(), rel:new Set() };
    const s = DATA.stars.find(x=>x.id===id) || { name:'星汇' };
    document.getElementById('dName').textContent = s.name;
    document.getElementById('dSub').textContent = '微博统一时间线 · 已读帖自动折叠 · 可标记已读收纳';
    renderDetail();
    go('star');
  } else if (view === 'mine'){
    go('mine');
  } else if (view === 'birthday'){
    go('birthday');
    renderBirthday();
  } else {
    go('home');
  }
  if (view === 'home') hbDotUpdate();   /* 回到首页：按 seen 时刻重算小红点 */
}

/* 进入子页面：压入一条 History 状态（不刷新页面），用于系统返回时还原 */
function navigate(view, extra){
  history.pushState(Object.assign({ view:view }, extra || {}), '', location.pathname + location.search);
  showView(view, extra);
}

/* 应用内“返回”：优先浏览器历史后退（与系统返回无缝衔接），首页兜底回首页 */
function appBack(){
  if (history.state && history.state.view && history.state.view !== 'home'){
    history.back();
  } else {
    go('home');
  }
}

/* 系统 / 浏览器 popstate：由 WebView.goBack() 触发，按状态还原视图 */
window.addEventListener('popstate', function(e){
  const st = (e.state && e.state.view) ? e.state : { view:'home' };
  showView(st.view, st);
});

/* 小红点：App 切后台 / 页面隐藏 → 记下离开时刻；回到前台且停在首页 → 重算红点 */

/* 媒体区：三个平台共用同一套规则，保证封面/视频/占位的结构完全一致
   ① 采到的真实多图 → 真图；② 单张封面（cover）→ 真图 + 角标；
   ③ 都没有 → 按平台配色的统一占位块（带「封面待采集」提示，不再出现随机色块） */
const PH_CLS = { weibo:'ph-weibo' };
function mediaBlock(p){
  const badge = p.video ? `<span class="vbadge">${p.vlabel || '▶ 视频'}</span>` : '';
  const play  = p.video ? `<span class="vplay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>` : '';
  const pcls = PH_CLS[p.platform] || 'ph-weibo';
  /* referrerpolicy=no-referrer 绕过图床（新浪）Referer 防盗链，否则在 github.io 域下被 403；
     onerror 不再隐藏图片，而是给 .ph 加 imgfail 显示占位提示，避免空白 */
  const imgTag = u => `<img src="${u}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.ph').classList.add('imgfail')">`;
  if (p.imgs && p.imgs.length){
    return `<div class="p-pics">${p.imgs.slice(0,3).map((u,i)=>
      `<div class="ph ph-real">${imgTag(u)}${(p.video && i===0) ? badge + play : ''}</div>`
    ).join('')}</div>`;
  }
  const legacy = (p.pics && p.pics.length) ? p.pics : [];
  const hasCover = !!p.cover;
  if (!legacy.length){
    if (!hasCover && !p.video) return '';            /* 纯文本动态：与微博保持一致，不加媒体块 */
    return `<div class="p-pics"><div class="ph ${pcls}">
      ${hasCover ? imgTag(p.cover) : CAM}
      <span class="ph-tip">${p.video ? '视频封面待采集' : '封面待采集'}</span>${badge}${play}</div></div>`;
  }
  return `<div class="p-pics">${legacy.map((c,i)=>{
    const real = (hasCover && i === 0);
    const cover = real ? imgTag(p.cover) : '';
    const cls = /^ph-/.test(String(c)) || real ? (real ? 'ph-real' : pcls) : c;
    return `<div class="ph ${cls}">${cover}${(!real && i === 0) ? '<span class="ph-tip">封面待采集</span>' : ''}${real ? '' : CAM}${(p.video && i===0) ? badge + play : ''}</div>`;
  }).join('')}</div>`;
}

function fmtStat(v){
  const s = (v === undefined || v === null) ? '' : String(v).trim();
  if (!s) return '—';
  if (/^\d+$/.test(s)){
    const n = +s;
    return n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '万' : s;
  }
  return s;
}
function statsRow(p){
  const st = p.stats || {};
  const spec = STATS_SPEC[p.platform] || STATS_SPEC.weibo;
  return `<div class="p-stats">${spec.map(([k,l])=>
    `<span class="st">${STAT_ICON[l] || I_HEART}${l} ${fmtStat(st[k])}</span>`).join('')}</div>`;
}

/* 从原帖链接解析该条内容在对应平台的资源 ID（用于直达 App 内的「这一条」） */
function postId(p){
  const l = p.link || '';
  let m;
  m = l.match(/weibo\.com\/\d+\/([A-Za-z0-9]+)/);                       if (m) return m[1];
  m = l.match(/m\.weibo\.cn\/(?:detail|status)\/([A-Za-z0-9]+)/);       if (m) return m[1];
  return '';
}

/* 兜底用：按内容在微博内搜索（拿不到帖子 ID 时使用） */
function searchScheme(p){
  const q = safeEncode((p.text || '').replace(/\s+/g, ' ').trim().slice(0, 16));
  return 'sinaweibo://search?q=' + q;
}
/* 直达该条帖子的原生 App Scheme；拿不到帖子 ID 时退化为按内容搜索 */
function deepLink(p){
  const id = postId(p);
  return id ? 'sinaweibo://detail?mblogid=' + id : searchScheme(p);
}

/* 回退用的手机网页版地址（一律移动端，与 PC 页面无关） */
function webFallback(p){
  const id = postId(p);
  if (id) return 'https://m.weibo.cn/detail/' + id;
  const link = toMobile(p.link);
  return link || contentLink(p.platform, p.text || '');
}

/* 原生桥：星汇 APK 内由 Android 提供 StarHubNative.open(url)，
   直接经系统 Intent 打开 —— WebView 里 JS 发起的 location 跳转不会经过
   shouldOverrideUrlLoading 拦截器，必须走这条桥才能真正唤起 App/浏览器；
   普通浏览器里没有该对象，返回 false 走网页逻辑 */
function nativeOpen(u){
  try {
    var b = window.StarHubNative;
    if (b && typeof b.open === 'function'){ b.open(u); return true; }
  } catch(_) {}
  return false;
}

/* ============ 运行环境判定：一切跳转以手机端为准 ============
   App 内（有原生桥）＝手机；手机浏览器按 UA / 粗指针判定；桌面不算手机。 */
function isPhone(){
  try { if (window.StarHubNative && typeof window.StarHubNative.open === 'function') return true; } catch(_) {}
  if (navigator.maxTouchPoints > 0 && window.matchMedia
      && window.matchMedia('(pointer:coarse)').matches) return true;
  return /Android|iPhone|iPad|iPod|Windows Phone|HarmonyOS|Mobile/i.test(navigator.userAgent || '');
}

/* 统一埋点：微博共用同一份记录，便于核对跳转成功率 */
function trackJump(platform, kind, target, result){
  try {
    const log = JSON.parse(store.getItem('starhub_jump_log') || '[]');
    log.push({ t: Date.now(), platform: platform, kind: kind,
               target: String(target || '').slice(0, 160), result: result });
    store.setItem('starhub_jump_log', JSON.stringify(log.slice(-200)));
  } catch(_) {}
  try { console.log('[jump]', platform, kind, result, target); } catch(_) {}
}

/* 网页版回退：App 内经原生桥交给系统浏览器打开（WebView 自带的渲染器
   加载微博等网页版会白屏，必须换系统浏览器）；普通浏览器用 window.open */
function gotoWeb(web){
  if (nativeOpen(web)) return;
  const w = window.open(web, '_blank', 'noopener');
  if (!w) window.location.href = web;
}

/* ============ 统一跳转引擎 ============
   微博、主页 / 帖子 全部走这一个函数，行为与提示完全一致：
     ① 桌面端不跳转、不展示外链内容，只提示用手机；
     ② 手机端先依次尝试 App 的 scheme/deeplink（1.1s 一个，页面切后台即判定成功）；
     ③ 全部没唤起成功 → 打开该平台手机网页版，并给出与微博相同的兜底提示；
     ④ 每一步都写同一份埋点。 */
function openExternal(o, e){
  if (e && e.preventDefault) e.preventDefault();
  o = o || {};
  const platform = o.platform || '';
  const kind = o.kind || 'content';
  const label = (SRC[platform] && SRC[platform].label) || o.label || '外部平台';
  const list = (o.schemes || []).filter(Boolean);
  const web  = o.web || '';

  if (!isPhone()){
    toast('请用手机打开星汇 App 查看「' + label + '」内容');
    trackJump(platform, kind, list[0] || web, 'desktop_blocked');
    return false;
  }
  if (!web){
    toast('「' + label + '」这条内容暂无有效链接，稍后由采集更新');
    trackJump(platform, kind, '', 'no_link');
    return false;
  }

  toast('正在唤起' + label + '…');
  let settled = false;
  function onVis(){ if (document.hidden){ settled = true; document.removeEventListener('visibilitychange', onVis); } }
  document.addEventListener('visibilitychange', onVis);

  (function attempt(i){
    if (settled){ trackJump(platform, kind, list[i-1] || web, 'app_opened'); return; }
    if (i >= list.length){
      document.removeEventListener('visibilitychange', onVis);
      toast('未检测到' + label + 'App，正在打开手机网页版');   /* 与微博完全一致的兜底提示 */
      trackJump(platform, kind, web, 'web_fallback');
      gotoWeb(web);
      return;
    }
    setTimeout(function(){ attempt(i + 1); }, 1100);
    try {
      if (!nativeOpen(list[i])) window.location.href = list[i];
    } catch(_) { trackJump(platform, kind, list[i], 'scheme_error'); }
  })(0);
  return false;
}

/* 「前往主页」：按平台依次尝试主页 Scheme，失败回退该平台手机网页版。 */
function openHome(key, uid, e){
  const a = ACCOUNTS[key];
  if (!a) return false;
  const id = uid || a.id;
  let schemes = a.schemes.slice(), url = a.url;
  if (key === 'weibo'){
    /* userinfo?uid 是直达用户主页最稳的 scheme；cardlist 在新版微博常被弱化（唤起后落空白页），
       故降为后备。两者都失败则走网页兜底 m.weibo.cn/u/<uid>（已验证有效） */
    schemes = [`sinaweibo://userinfo?uid=${id}`, `sinaweibo://cardlist?containerid=100505${id}`];
    url = `https://m.weibo.cn/u/${id}`;
  }
  return openExternal({ platform:key, kind:'home', label:a.label, schemes:schemes, web:url }, e);
}

/* 帖子跳转参数统一由这条函数产出（不再是每个平台各写一套），
   结果按 _uid 暂存，避免把带引号/问号的 scheme 拼进 inline onclick */
const JUMP_MAP = {};
function contentJump(p){
  const primary = deepLink(p), alt = searchScheme(p), web = webFallback(p);
  const schemes = primary === alt ? [primary] : [primary, alt];
  return { platform:p.platform, kind:'post', schemes:schemes, web:web };
}
function openPost(uid, e){
  const o = JUMP_MAP[uid];
  if (!o){ toast('内容未就绪，请稍后重试'); return false; }
  return openExternal(o, e);
}
function jumpA(p, label){
  JUMP_MAP[p._uid] = contentJump(p);
  const web = JUMP_MAP[p._uid].web;
  return `<a class="jump" href="${web}" onclick="return openPost('${p._uid}',event)"
    title="在手机上唤起${SRC[p.platform].label}App 打开本条内容；未安装则打开手机网页版">${label || '前往原平台查看'} ${EXT}</a>`;
}

/* 统一动态卡片：微博共用同一结构（头像/作者/平台 → 标题 → 正文 → 封面 → 互动数据 → 时间+跳转），
   内容始终完整展示（无折叠）；已读按钮负责清理旧帖 */
const AV_CLS = { weibo:'av-weibo' };
function postCard(p){
  const s = SRC[p.platform], read = readSet.has(p._uid);
  const av = String(p.account || '？').trim().charAt(0) || '？';
  return `
  <div class="post" data-uid="${p._uid}">
    <div class="p-top">
      <span class="p-av ${AV_CLS[p.platform] || 'av-weibo'}">${av}</span>
      <span class="p-account">${p.account}</span>
      <span class="p-tag">${p.tag}</span>
      <span class="p-src ${s.cls}">${s.label}${EXT}</span>
    </div>
    <div class="p-main">
      <div class="p-body">
        ${p.title ? `<div class="p-title">${p.title}</div>` : ''}
        ${(p.text && String(p.text).trim()) ? `<div class="p-text">${p.text}</div>` : (mediaBlock(p) ? '' : '<div class="p-text" style="color:var(--ink3)">（正文加载中…）</div>')}
        ${mediaBlock(p)}
        ${statsRow(p)}
        <div class="p-foot">
          <span title="${fullTime(p.time)}">${timeStr(p.time)}</span>
          <button class="read-btn ${read ? 'done' : ''}" onclick="toggleRead('${p._uid}')"
            title="${read ? '点击取消已读，保持展开' : '阅读完成后点击，将其折叠收纳'}">${read ? '已读 ✓' : '标记已读'}</button>
          ${jumpA(p)}
        </div>
      </div>
    </div>
  </div>`;
}

/* 取某分区当前应展示的帖（供展开/收起与渲染共用，保证两边口径一致） */
function curList(key){
  const d = DATA[curStar];
  if (key === 'own'){
    /* 本人区：无筛选，全量展示 */
    return d.own.slice();
  }
  /* 相关账号区：只应用账号筛选 */
  let list = d.related.slice();
  if (curRelFilter !== 'all') list = list.filter(p => p.account === curRelFilter);
  return list;
}

/* 分区渲染（合并「整体折叠」+「标记已读」）：
   1) 未读帖（新帖 / 取消已读的帖）→ 始终完整展开显示，不受整体折叠影响；
   2) 已读帖 → 默认隐藏（折叠区），只露出占位条；点「展开 N 条」每次放出 5 条；
   3) 已读帖全部放出后显示「收起全部 ▲」，点击重新把它们收进折叠区；
   4) 筛选（账号）由调用方传入的 list 已过滤，本函数只管折叠与呈现。 */
function sectionRender(list, key){
  const sorted = list.slice().sort((a,b)=>b.time-a.time);
  if (sorted.length === 0) return '';
  /* 展开规则（本人区与所有相关账号区统一适用）：
     - 未读帖（新帖）始终展开；
     - 若未读 >= 2 条，则已读帖全部折叠（即使已读是最新的一条，也照样折叠）；
     - 若未读 < 2 条，则按时间倒序把已读帖补充进展开集合，使「展开总数」保持为最新的 2 条。 */
  const unread = sorted.filter(p => !readSet.has(p._uid));
  const expanded = new Set(unread.map(p => p._uid));
  if (unread.length < 2){
    for (const p of sorted){          /* sorted 已按时间倒序排列 */
      if (expanded.size >= 2) break;
      if (readSet.has(p._uid)) expanded.add(p._uid);
    }
  }
  /* 展开区：未读帖 ∪ 经上述规则补充进来的最新已读帖 */
  const open = sorted.filter(p => expanded.has(p._uid));
  /* 已读且未进入展开区的帖：进入折叠区 */
  const readAll = sorted.filter(p => readSet.has(p._uid) && !expanded.has(p._uid));
  const readShown = readAll.filter(p => revealed[key].has(p._uid));
  const readHidden = readAll.filter(p => !revealed[key].has(p._uid));
  /* 展示顺序：展开帖在上（时间倒序），已放出的已读帖跟在后面 */
  const cards = open.concat(readShown).map(p => postCard(p)).join('');
  let ctrl = '';
  /* 折叠区还有未放出的已读帖 → 「展开 N 条已读帖」入口 */
  if (readHidden.length > 0){
    ctrl += `<div class="fold-more" onclick="expandMore('${key}')">展开 ${Math.min(5, readHidden.length)} 条已读帖（还差 ${readHidden.length} 条折叠）</div>`;
  }
  /* 折叠区已放出帖子 → 「收起全部」入口 */
  if (readShown.length > 0){
    ctrl = `<div class="fold-collapse" onclick="collapseAll('${key}')">收起全部 ▲</div>` + ctrl;
  }
  /* 整区无任何展开帖、已读帖也全折叠 → 显示整体折叠占位条 */
  if (open.length === 0 && readShown.length === 0){
    ctrl = `<div class="fold-bar" onclick="expandMore('${key}')">
      <span class="fold-bar-txt">本区共 ${sorted.length} 条动态 · 已折叠</span>
      <span class="fold-bar-btn">展开 ${Math.min(5, sorted.length)} 条 ›</span></div>` + ctrl;
  }
  return cards + ctrl;
}
/* 展开折叠区：每次多放出 5 条已读帖（按时间倒序，从较新的已读帖开始） */
function expandMore(key){
  const sorted = curList(key).slice().sort((a,b)=>b.time-a.time);
  let added = 0;
  for (const p of sorted){
    if (readSet.has(p._uid) && !revealed[key].has(p._uid)){
      revealed[key].add(p._uid); added++;
      if (added >= 5) break;
    }
  }
  renderDetail();
}
/* 收起全部：该分区已放出的已读帖重新收进折叠区（未读帖不受影响，保持展开） */
function collapseAll(key){ revealed[key].clear(); renderDetail(); }

function renderDetail(){
  const d = DATA[curStar];
  const viewEl = document.getElementById('view-star');
  const sv = viewEl.scrollTop;   /* 重渲染后保持滚动位置，避免折叠/筛选时跳动 */
  const todaySum = d.own.concat(d.related).filter(p => isNew(p.time)).length;
  const acctCls = { weibo:'p-weibo' };
  const starAcct = (DATA.stars.find(s=>s.id===curStar)||{}).acct || {};
  const acctStrip = ['weibo'].map(k=>{
    const a = ACCOUNTS[k];
    const id = starAcct[k] || a.id;
    if (!id) return '';
    const url = `https://m.weibo.cn/u/${id}`;
    return `<a class="acct-item" href="${url}" onclick="return openHome('${k}','${id}',event)"
      title="点击唤起${a.label}App，未安装则打开网页版">
      <div class="a-p ${acctCls[k]}">${a.label}</div>
      <div class="a-id">${a.label === '微博' ? 'UID ' : a.label + '号 '}${id}</div>
      <div class="a-open">前往主页 ›</div>
    </a>`;
  }).join('');
  /* ===== 相关账号区：账号筛选行（唯一保留的筛选） =====
     列出该明星全部「有内容」的相关账号（按 STAR_REL 的既定顺序），只作用于相关账号区 */
  const relAccounts = (STAR_REL[curStar] || []).filter(a => d.related.some(p => p.account === a));
  const tabsA = [`<button class="ftab ${curRelFilter==='all'?'on':''}" onclick="setRelFilter('all')">全部</button>`]
    .concat(relAccounts.map(a =>
      `<button class="ftab ${curRelFilter===a?'on':''}" onclick='setRelFilter(${JSON.stringify(a)})'>${a}</button>`));
  const relAcctRow = `<div class="acct-row">
      <span class="acct-row-label">账号</span>
      <div class="filter-tabs acct-tabs">${tabsA.join('')}</div>
    </div>`;

  /* 本人区 / 相关账号区（列表由 curList 按各自板块的筛选派生） */
  const ownList = curList('own');
  const relListFinal = curList('rel');
  const allEmpty = (ownList.length + relListFinal.length) === 0 && (d.own.length + d.related.length) === 0;
  const winNote = allEmpty ? `<div class="empty-sm">近 ${MAX_AGE_DAYS} 天内暂无动态（已自动隐藏更早的内容）</div>` : '';
  const ownBlock = ownList.length
    ? `<div class="own-box">${sectionRender(ownList, 'own')}</div>`
    : `<div class="empty-sm">当前筛选下暂无本人动态</div>`;
  const relBlock = relListFinal.length
    ? `<div class="rel-box">
          <div class="rel-head"><div class="mini-av">${(DATA.stars.find(x=>x.id===curStar)||{}).name.charAt(0)}</div><b>${(DATA.stars.find(x=>x.id===curStar)||{}).name} · 相关账号</b><span>显示 ${relListFinal.length} 条</span></div>
          ${sectionRender(relListFinal, 'rel')}</div>`
    : `<div class="empty-sm">当前筛选下暂无相关账号动态</div>`;
  const PF_NAME = { weibo:'微博' };
  const pfList = [...new Set(d.own.concat(d.related).map(p=>p.platform))].map(k=>PF_NAME[k] || k);
  const liveBar = `<div class="live-bar">
    <span class="live-dot ${LIVE.ok ? '' : 'off'}"></span>
    <span class="live-txt">${LIVE.ok
      ? `${(d.own.length + d.related.length)} 条 · ${pfList.join(' / ') || '微博'}真实数据 · 更新于 ${new Date(LIVE.updatedAt).toTimeString().slice(0,5)}（自动每 5 分钟）`
      : '未连接采集服务 · 当前为内置数据'}</span>
    <button class="live-btn" onclick="refreshNow()">立即刷新</button>
  </div>`;
  const secNav = `<div class="sec-nav">
    <div class="snav" id="snav-own" onclick="jumpSec('own')">本人账号</div>
    <div class="snav" id="snav-rel" onclick="jumpSec('rel')">相关账号</div>
  </div>`;
  document.getElementById('dBody').innerHTML = `
    ${liveBar}
    ${winNote}
    <div class="acct-strip">${acctStrip}</div>
    ${secNav}
    ${todaySum ? `<div class="sec-label"><div class="bar" style="background:var(--wb)"></div>
      <h2>今日更新</h2><span>${todaySum} 条新动态</span></div>` : ''}
    <div class="sec-label" id="sec-own"><div class="bar"></div><h2>置顶 · 本人账号</h2><span>微博统一展示</span></div>
    ${ownBlock}
    <div class="sec-label" id="sec-rel" style="margin-top:6px"><div class="bar" style="background:#d8a13a"></div>
      <h2>相关账号动态</h2><span>工作室 / 粉丝站 / 剪辑号 / 播报员</span></div>
    ${relAcctRow}
    ${relBlock}`;
  viewEl.scrollTop = sv;
}

function openStar(id){
  /* 进入明星详情：相关账号区的账号筛选重置为「全部」，避免沿用上一明星的条件 */
  curRelFilter = 'all';
  revealed.own = new Set();
  revealed.rel = new Set();
  navigate('star', { star:id });
}

/* ================= 我的页 · 图片管理渲染 ================= */
let pendingStarId = null;
function renderMineImg(){
  const box = document.getElementById('imgMgr');
  box.innerHTML = DATA.stars.map(s=>{
    const custom = !!store.getItem(IMG_KEY(s.id));
    return `
    <div class="img-card">
      <div class="img-thumb"><img src="${getStarImg(s)}" alt="${s.name}" referrerpolicy="no-referrer"></div>
      <div class="img-info">
        <b>${s.name}</b>
        <div class="img-status">${custom ? '已自定义（保存在本机）' : '默认图片'}</div>
      </div>
      <button class="img-btn" onclick="pickImg('${s.id}')">更换图片</button>
      ${custom ? `<button class="img-btn ghost" onclick="resetImg('${s.id}')">恢复默认</button>` : ''}
    </div>`;
  }).join('');
}
function pickImg(id){
  pendingStarId = id;
  const input = document.getElementById('imgInput');
  input.onchange = () => changeImg(pendingStarId, input);
  input.click();
}
function resetImg(id){
  store.removeItem(IMG_KEY(id));
  renderHome(); renderMineImg();
  const s = DATA.stars.find(x=>x.id===id);
  toast(s.name + ' 已恢复默认图片');
}

/* ================= 实时数据：读取本机采集器的结果 =================
   采集器会定时抓取微博真实动态写入 data/posts.json，
   页面每 60 秒自动读取一次，有新帖立即出现在时间线上。 */
const LIVE = { ok:false, updatedAt:0, count:0, ids:new Set() };
/* 部署在 GitHub Pages（xxx.github.io）时属于云端模式：
   没有本地服务接口，直接读取仓库里的 data/posts.json，
   数据由 GitHub Actions 每 5 分钟自动更新。 */
const IS_CLOUD = /github\.io$|netlify\.app$|vercel\.app$|pages\.dev$/.test(location.hostname);

function toLivePost(p, i){
  /* 只剩微博平台：统一走微博渲染与跳转逻辑 */
  const pf = p.platform || 'weibo';
  const prefix = 'wb_';
  return {
    _uid: prefix + (p.id || p.link || i),
    platform:pf, account:p.account || '', tag:p.tag || '本人',
    text:p.text || '', time:p.time || 0, link:p.link || '',
    pics:[], imgs:(p.imgs || p.pics || []).slice(0,4),
    title:p.title || '',
    stats:p.stats || {},                       /* 互动数据缺省为 null → 卡片统一显示 — */
    video:!!p.video, cover:p.cover || '', vlabel:p.video ? '▶ 视频' : ''
  };
}
function reuid(){
  /* 真实采集数据保留 wb_ 前缀的真实 _uid；内置示例按「明星_own/rel_序号」补编号，保证跨明星唯一 */
  (DATA.stars || []).forEach(s=>{
    const d = DATA[s.id]; if (!d) return;
    d.own.forEach((p,i)=>{ if(!p._uid || String(p._uid).indexOf('demo_')===0) p._uid = 'demo_' + s.id + '_own_' + i; });
    d.related.forEach((p,i)=>{ if(!p._uid || String(p._uid).indexOf('demo_')===0) p._uid = 'demo_' + s.id + '_rel_' + i; });
  });
}
/* 账号归属纠正：按该明星的相关账号名单判定，
   「XX工作室 / 后援会 / 粉丝号」等一律算 related，只有本人号才是 own。
   （采集器早期用「昵称包含明星名」判本人，会把工作室误判成本人；此处兜底纠正） */
const ACCT_TAGS = {
  '侯明昊工作室':'工作室', '侯明昊全球后援会':'全球后援会', '侯明昊的桃园杂货铺':'桃园杂货铺',
  '侯会有期-昊友汇':'昊友汇', '桃圈播报员':'桃圈', '桃园云包小分队':'桃园杂货铺',
  '卢昱晓工作室':'工作室', '卢昱晓官方粉丝后援会':'后援会', '噜噜哈嘿':'粉丝号',
  '鲈鱼烧小卖部':'小卖部', '小雨露传声筒':'传声筒'
};
function fixAccountKind(p){
  const acct = String(p.account || '').trim();
  const tag = ACCT_TAGS[acct];
  if (tag){ p.kind = 'related'; p.tag = tag; return; }   /* 名单内 = 相关账号 */
  /* 本人号：昵称等于明星名，或在其后仅附加装饰字符（例：卢昱晓_） */
  const star = (DATA.stars || []).find(s => s.id === p.star);
  if (star){
    const nm = String(star.name || '').replace(/[\s_·・\-—]+/g, '');
    const n  = acct.replace(/[\s_·・\-—]+/g, '');
    if (nm && n === nm){ p.kind = 'own'; p.tag = '本人'; return; }
    if (nm && n.startsWith(nm) && n.length - nm.length <= 2){
      const tail = n.slice(nm.length);
      if (!/工作室|后援|会|官方|粉丝|团|站|社|号|小卖|铺|解说|应援|超话|运营|事务|中心|全球|联盟|集|部/.test(tail)){
        p.kind = 'own'; p.tag = '本人';
      }
    }
  }
}
function applyLive(posts, updatedAt){
  /* 时间窗口过滤（统一入口）：超过 180 天的动态在此一次性剔除，
     下游首页预览 / 详情页列表 / 筛选 / 统计全部基于过滤后的 DATA，行为天然一致 */
  posts = freshOnly(posts);
  /* 按 star 分流：每条帖自带 star 字段（采集器写入），分桶后逐明星合并 */
  posts.forEach(fixAccountKind);
  const byStar = {};
  posts.forEach(p => { const s = p.star || 'hmh'; (byStar[s] = byStar[s] || []).push(p); });
  /* 全局真实平台集合：任一明星某平台有真实数据，则该平台占位示例被替换（避免重复） */
  const realPlats = new Set(posts.map(p => p.platform || 'weibo'));
  (DATA.stars || []).forEach(s=>{
    const d = DATA[s.id]; if (!d) return;
    const sp = byStar[s.id] || [];
    const ownReal = sp.filter(p => p.kind !== 'related').map(toLivePost);
    const relReal = sp.filter(p => p.kind === 'related').map(toLivePost);
    d.own     = freshOnly(ownReal.concat(d.own.filter(p => !realPlats.has(p.platform))));
    d.related = freshOnly(relReal.concat(d.related.filter(p => !realPlats.has(p.platform))));
    /* 首页预览取该明星全部平台里最新的一条 */
    const newest = d.own.slice().sort((a,b)=>b.time-a.time)[0]
                || d.related.slice().sort((a,b)=>b.time-a.time)[0];
    if (newest) s.latest = newest.text.replace(/\s+/g,' ').slice(0, 34);
    else if (sp.length) s.latest = '';   /* 有数据但全被时间窗口过滤掉 → 清空预览文案 */
  });
  reuid();
  LIVE.ok = true; LIVE.updatedAt = updatedAt || Date.now();
  LIVE.count = (DATA[curStar] ? (DATA[curStar].own.length + DATA[curStar].related.length) : posts.length);
  LIVE.ids = new Set(posts.map(p => p.id));
}
async function loadLive(silent){
  let data = null;
  for (const u of (IS_CLOUD ? ['data/posts.json'] : ['api/posts', 'data/posts.json'])){
    try{
      const r = await fetch(u + '?t=' + Date.now(), { cache:'no-store' });
      const j = await r.json();
      if (j && j.posts && j.posts.length){ data = j; break; }
    }catch(e){ /* file:// 打开或未连服务时忽略，继续使用内置数据 */ }
  }
  if (!data){
    if(!silent) toast('未连接采集服务，当前为内置数据');
    ensureStartupSnap();                 /* 无线上数据时，用内置示例作为启动快照，全部标为已读折叠 */
    if (curStar) renderDetail();
    return false;
  }
  const isNew = freshOnly(data.posts).some(p => !LIVE.ids.has(p.id));
  applyLive(data.posts, data.updatedAt);
  ensureStartupSnap();                   /* 首次加载成功：把当时全部帖子纳入启动快照 → 默认已读折叠 */
  renderHome();
  if (curStar) renderDetail();
                     /* 重拉后按 seen 时刻重算红点（seen 只在「点红点确认」时前进，这里不自动清零） */
  hbDotUpdate();                         /* 其余情况按 seen 时刻重算右上角小红点 */
  updateLastUpd();                      /* 刷新「最近更新」文案 */
  if (isNew && !silent) toast('已更新：抓到新的微博动态');
  return isNew;
}
/* 用已保存的 GitHub 令牌直接触发 collect.yml 工作流：不等 5 分钟定时，约 30~60 秒后出新帖 */
let _lastDispatch = 0;
function triggerCollectNow(){
  let tk = ghToken();
  if (!tk){
    /* 从未保存过令牌：弹一次输入框（只此一次，之后存 localStorage 不再问） */
    const v = (prompt('粘贴 GitHub 令牌（github_pat_…，需 Actions: Read and write 权限）后点「立即刷新」即可马上采集：') || '').trim();
    if (!v) return false;
    try { localStorage.setItem('sh_gh_token', v); } catch(e){}
    tk = v;
  }
  const now = Date.now();
  if (now - _lastDispatch < 60000) return 'throttled';   /* 60 秒内不重复触发，避免刷爆 Actions */
  _lastDispatch = now;
  fetch('https://api.github.com/repos/lulu1234-netize/starhub/actions/workflows/collect.yml/dispatches', {
    method:'POST',
    headers:{ 'Authorization':'Bearer ' + tk, 'Content-Type':'application/json', 'Accept':'application/vnd.github+json' },
    body: JSON.stringify({ ref:'main' })
  }).then(r=>{
    if (r.status === 204 || (r.status >= 200 && r.status < 300)){
      toast('已触发采集，约 30~60 秒后自动刷新…');
      setTimeout(()=>loadLive(false), 45000);
    } else {
      loadLive(false);                         /* 令牌缺 workflow 范围等 → 直接重拉现有数据 */
    }
  }).catch(()=>{ loadLive(false); });          /* CORS/网络异常 → 直接重拉，不阻塞 */
  return true;
}
function refreshNow(){
  if (IS_CLOUD){
    toast('正在拉取 GitHub 上的最新数据…');
    const r = triggerCollectNow();
    if (r !== true) loadLive(false);           /* 无令牌 / 被限流：直接重拉当前数据 */
    return;
  }
  toast('正在采集，约 20 秒后自动刷新…');
  fetch('api/refresh?t=' + Date.now(), { cache:'no-store' }).catch(()=>{});
  setTimeout(()=>loadLive(false), 18000);
}

/* ================= 生日提醒（联系人管理 + 云端定时邮件） =================
   数据存仓库 data/birthdays.json（与 posts.json 同机制）；浏览器内用 localStorage 做缓存，
   改动后通过 GitHub Contents API 写回仓库（需令牌具备 repo 写权限），GitHub Actions 每日 00:00 发邮件。 */
const BD_REPO = 'lulu1234-netize/starhub';
const BD_FILE = 'data/birthdays.json';
let BIRTHDAYS = [];
let bdSha = null;
const BD_KEY = 'starhub_birthdays';

function escAttr(s){ return String(s == null ? '' : s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function bdLoadLocal(){
  try { const v = JSON.parse(store.getItem(BD_KEY) || '[]'); if (Array.isArray(v)) BIRTHDAYS = v; } catch(e){}
}
function bdSaveLocal(){ try { store.setItem(BD_KEY, JSON.stringify(BIRTHDAYS)); } catch(e){} }
function bdDaysUntil(mmdd){
  const [m,d] = mmdd.split('-').map(Number);
  const now = new Date(Date.now() + 8*3600e3);
  const y = now.getUTCFullYear(), t = now.getUTCMonth()+1, dd = now.getUTCDate();
  const today = new Date(Date.UTC(y, t-1, dd)).getTime();
  let next = new Date(Date.UTC(y, m-1, d));
  if (next.getTime() < today) next = new Date(Date.UTC(y+1, m-1, d));
  return Math.round((next.getTime() - today) / 86400e3);
}
function mdOptions(kind, cur){
  const n = kind === 'm' ? 12 : 31;
  let s = '';
  for (let i = 1; i <= n; i++){
    const v = String(i).padStart(2, '0');
    s += '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + v + '</option>';
  }
  return s;
}
function renderBirthday(){
  const box = document.getElementById('bdList');
  if (!box) return;
  if (!BIRTHDAYS.length){ box.innerHTML = '<div class="empty">还没有联系人，在上方添加一位吧。</div>'; return; }
  box.innerHTML = BIRTHDAYS.map((b,i)=>{
    const days = bdDaysUntil(b.birthday);
    const tip = days === 0 ? '今天生日' : ('还有 ' + days + ' 天');
    const p = (b.birthday || '01-01').split('-');
    return '<div class="bd-card">'
      + '<input class="bd-name" value="'+escAttr(b.name)+'" placeholder="姓名">'
      + '<div class="bd-md"><select class="bd-month">'+mdOptions('m', p[0])+'</select><span class="bd-sep">月</span>'
      + '<select class="bd-day">'+mdOptions('d', p[1])+'</select><span class="bd-sep">日</span></div>'
      + '<label class="bd-sw"><input type="checkbox" class="bd-early"'+(b.early?' checked':'')+'> 提前购礼</label>'
      + '<div class="bd-meta">'+tip+'</div>'
      + '<div class="bd-ops"><button class="read-btn" onclick="bdSave('+i+')">保存</button>'
      + '<button class="read-btn done" onclick="bdDel('+i+')">删除</button></div>'
      + '</div>';
  }).join('');
}
function initBDSelectors(){
  const m = document.getElementById('bd-month'), d = document.getElementById('bd-day');
  if (m && !m.options.length){
    for (let i = 1; i <= 12; i++){ const v = String(i).padStart(2, '0'); m.insertAdjacentHTML('beforeend', '<option value="'+v+'">'+v+'</option>'); }
  }
  if (d && !d.options.length){
    for (let i = 1; i <= 31; i++){ const v = String(i).padStart(2, '0'); d.insertAdjacentHTML('beforeend', '<option value="'+v+'">'+v+'</option>'); }
  }
}
function bdAdd(){
  const name = document.getElementById('bd-name').value.trim();
  const m = document.getElementById('bd-month').value;
  const d = document.getElementById('bd-day').value;
  const early = document.getElementById('bd-early').checked;
  if (!name || !m || !d){ toast('请填写姓名和生日'); return; }
  BIRTHDAYS.push({ id:'b'+Date.now(), name, birthday:m+'-'+d, early });
  bdSaveLocal(); renderBirthday(); bdPush();
  document.getElementById('bd-name').value=''; document.getElementById('bd-early').checked=false;
}
function bdSave(i){
  const row = document.getElementById('bdList').children[i];
  if (!row) return;
  const name = row.querySelector('.bd-name').value.trim();
  const m = row.querySelector('.bd-month').value;
  const d = row.querySelector('.bd-day').value;
  const birthday = m+'-'+d;
  const early = row.querySelector('.bd-early').checked;
  if (!name || !birthday){ toast('姓名和生日不能为空'); return; }
  BIRTHDAYS[i] = { id:(BIRTHDAYS[i]&&BIRTHDAYS[i].id)||('b'+Date.now()), name, birthday, early };
  bdSaveLocal(); renderBirthday(); bdPush();
}
function bdDel(i){
  const name = BIRTHDAYS[i] ? BIRTHDAYS[i].name : '';
  if (!confirm('确定删除「'+name+'」？')) return;
  BIRTHDAYS.splice(i,1); bdSaveLocal(); renderBirthday(); bdPush();
}
async function bdLoadRepo(){
  try {
    const r = await fetch(BD_FILE + '?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j)){ BIRTHDAYS = j; bdSaveLocal(); renderBirthday(); }
  } catch(e){}
}
async function bdPush(){
  const tk = ghToken();
  if (!tk){ toast('未配置 GitHub 令牌，仅本机保存'); return; }
  let sha = bdSha;
  if (!sha){
    try {
      const r = await fetch('https://api.github.com/repos/'+BD_REPO+'/contents/'+BD_FILE+'?ref=main',
        { headers:{ Authorization:'Bearer '+tk, Accept:'application/vnd.github+json' } });
      if (r.ok){ const j = await r.json(); sha = j.sha; bdSha = sha; }
    } catch(e){}
  }
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(BIRTHDAYS, null, 2))));
  const body = { message:'chore: update birthdays', content };
  if (sha) body.sha = sha;
  try {
    const r = await fetch('https://api.github.com/repos/'+BD_REPO+'/contents/'+BD_FILE, {
      method:'PUT',
      headers:{ Authorization:'Bearer '+tk, 'Content-Type':'application/json', Accept:'application/vnd.github+json' },
      body: JSON.stringify(body)
    });
    if (!r.ok){ toast('同步失败：令牌需 repo 写权限'); return; }
    const j = await r.json(); bdSha = j.content.sha; toast('已同步到云端');
  } catch(e){ toast('同步失败，已本机保存'); }
}

/* ================= 启动（出错时页面显示错误而非白屏） ================= */
window.addEventListener('error', e=>{
  const t = document.getElementById('toast');
  if (t){ t.textContent = '脚本错误：' + e.message; t.classList.add('show'); }
});
renderHome();
hbDotUpdate();          /* 启动即按 seen 时刻判定一次（冷启动期间到达的新帖会显示红点） */
renderMineImg();
bdLoadLocal(); bdLoadRepo(); initBDSelectors();
/* 微博采集由 GitHub Actions 每 5 分钟自动跑；首页「立即刷新」会按需触发一次，拉取在 loadLive 里完成 */
ensureStartupSnap();   /* 内置示例先纳入启动快照（全部标为已读折叠），loadLive 成功后会再次确认 */
/* 启动即拉取本机采集到的真实动态；之后每分钟检查一次是否有新帖 */
/* ===== 首页下拉刷新（顶部下拉 → 触发 loadLive + renderHome） ===== */
function initPTR(){
  const view = document.getElementById('view-home');
  const pill = document.getElementById('ptrPill');
  const txt  = document.getElementById('ptrTxt');
  if(!view || view.__ptrInit) return;
  view.__ptrInit = true;
  let sy = 0, pulling = false, armed = false, dist = 0;
  const TH = 70;
  view.addEventListener('touchstart', function(e){
    if(view.scrollTop <= 0){ sy = e.touches[0].clientY; pulling = true; armed = false; dist = 0; }
    else { pulling = false; }
  }, {passive:true});
  view.addEventListener('touchmove', function(e){
    if(!pulling) return;
    dist = e.touches[0].clientY - sy;
    if(dist > 0 && view.scrollTop <= 0){
      e.preventDefault();
      armed = dist >= TH;
      txt.textContent = armed ? '松手立即刷新' : '下拉刷新';
      pill.classList.add('show');
    } else if(dist <= 0){
      pill.classList.remove('show');
    }
  }, {passive:false});
  view.addEventListener('touchend', function(){
    if(pulling && armed){
      txt.textContent = '正在刷新…';
      pill.classList.add('show');
      Promise.resolve(loadLive(false)).then(function(){
        renderHome();
        checkSelfUpdate();   /* 下拉刷新时也顺带检查前端版本，有新代码立即重载 */
        toast('已刷新到最新动态');
      }).catch(function(){ toast('刷新失败，请检查网络'); }).finally(function(){
        setTimeout(function(){ pill.classList.remove('show'); }, 600);
      });
    } else {
      pill.classList.remove('show');
    }
    pulling = false; armed = false; dist = 0;
  });
}
initPTR();

/* ===== 详情页：本人 / 相关账号 锚点导航（点击平滑滚动 + 滚动高亮） ===== */
function setSnav(w){
  const a = document.getElementById('snav-own'), b = document.getElementById('snav-rel');
  if(a) a.classList.toggle('on', w === 'own');
  if(b) b.classList.toggle('on', w === 'rel');
}
function jumpSec(w){
  const el = document.getElementById(w === 'own' ? 'sec-own' : 'sec-rel');
  const view = document.getElementById('view-star');
  if(!el || !view) return;
  view.scrollTo({ top: Math.max(el.offsetTop - 70, 0), behavior: 'smooth' });
  setSnav(w);
}
(function initSecSpy(){
  const view = document.getElementById('view-star');
  if(!view || view.__spyInit) return;
  view.__spyInit = true;
  let raf = null;
  view.addEventListener('scroll', function(){
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = null;
      const o = document.getElementById('sec-own'), r = document.getElementById('sec-rel');
      if(!o || !r) return;
      setSnav(view.scrollTop + 90 >= r.offsetTop ? 'rel' : 'own');
    });
  }, {passive:true});
})();

loadLive(true);
setInterval(()=>loadLive(true), 60000);

/* 自检更新：对比线上 meta.json 的版本号，发现前端有新版就自动重载（解决 WebView 缓存旧 index.html 的问题） */
function checkSelfUpdate(){
  fetch('meta.json?_=' + Date.now(), {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ if(j && j.ver && j.ver !== APP_VER){ location.reload(true); } })
    .catch(()=>{});
}
checkSelfUpdate();
setInterval(checkSelfUpdate, 60000);

/* 整页横向拖拽兜底已移除：它与边缘右滑手势争抢同一条touchmove 通道，
   会在手势锁定前抢先preventDefault，导致边缘返回永远触发不了。
   现在由手势模块内部的横向锁定（touch-action:pan-y + preventDefault）统一负责。 */
