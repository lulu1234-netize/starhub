name: 抖音采集（腾讯云函数）

on:
  schedule:
    # UTC 每小时整点触发（北京时间整点，全天一致）。
    # 单次采集约 2-4 分钟，远小于 1 小时间隔，绝不会并发叠加。
    # 实际数据延迟 = 采集耗时 + 等待下一次触发（0~60 分钟）。
    - cron: '0 * * * *'
  workflow_dispatch: {}

# 防止上一次未跑完就叠加下一次（GitHub Actions 同一 workflow 默认会并发排队）
concurrency:
  group: douyin-collect
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    # 采集含冷启动 + 多个 60s 超时串行等待，保守留足余量。
    # 原8 分钟偏紧，慢速情况下尾部可能被强杀导致写回中断。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 调用腾讯云函数采集抖音并写回
        run: node scripts/scf_invoke.js
        env:
          TC_SECRET_ID: ${{ secrets.TC_SECRET_ID }}
          TC_SECRET_KEY: ${{ secrets.TC_SECRET_KEY }}