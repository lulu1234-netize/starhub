name: 抖音采集（已停用）

# 该工作流已停用：抖音采集链路不稳定（Chrome 冷启动、风控、Cookie 过期反复失败），
# 故移除自动调度，仅保留手动触发入口。如需恢复自动采集，把下面 schedule 段取消注释，
# 并在仓库 Settings → Secrets 配好 TC_SECRET_ID / TC_SECRET_KEY 后重新启用工作流。
on:
  # schedule:
  #   - cron: '0 * * * *'   # 恢复时启用：每小时整点（北京时间）
  workflow_dispatch: {}

# 防止上一次未跑完就叠加下一次（GitHub Actions 同一 workflow 默认会并发排队）
concurrency:
  group: douyin-collect
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    # 采集含冷启动 + 多个 60s 超时串行等待，保守留足余量。
    # 原8 分钟偏紧，慢速情况下尾部可能被强杀导致写回中断。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 调用腾讯云函数采集抖音并写回
        run: node scripts/scf_invoke.js
        env:
          TC_SECRET_ID: ${{ secrets.TC_SECRET_ID }}
          TC_SECRET_KEY: ${{ secrets.TC_SECRET_KEY }}
