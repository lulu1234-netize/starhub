name: 星汇·抖音小红书采集

# 抖音/小红书需要浏览器渲染取数，耗时比微博长，因此采集频率低于微博。
# 想在网页手动跑一次：仓库 Actions 页 → 本任务 → Run workflow。
on:
  schedule:
    - cron: '17,47 * * * *'     # 每小时两次（错开微博任务，避免并发冲突）
  workflow_dispatch:            # 可在网页手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    # 与微博采集任务共用同一个并发锁，避免两个 workflow 同时改仓库造成冲突
    concurrency:
      group: starhub-data-write
      cancel-in-progress: false
    env:
      # 采集器内部已按 UTC+8 显式换算，这里再显式声明一次，
      # 保证提交信息与任何 Date 相关逻辑都落在北京时间
      TZ: Asia/Shanghai
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 浏览器体积较大，缓存后每次可省下 1~2 分钟
      - name: 缓存浏览器
        id: cache-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('collector/package.json') }}

      - name: 安装采集依赖与浏览器
        run: |
          cd collector
          npm install --no-audit --no-fund
          if [ "${{ steps.cache-browser.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: 采集抖音 / 小红书
        env:
          # 小红书两项为可选：不配置就跳过小红书，不影响抖音采集
          XHS_USER_ID: ${{ secrets.XHS_USER_ID }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          STARHUB_MAX_DETAIL: '10'
        run: node collector/collect_headless.js

      - name: 合并全部平台数据
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: node collector/collect_http.js

      - name: 提交最新数据
        run: |
          git config user.name "starhub-bot"
          git config user.email "starhub-bot@users.noreply.github.com"
          git add -A data/posts.json data/posts_ext.json data/lastcheck.json
          if git diff --staged --quiet; then
            echo "本次没有新内容，跳过提交"
          else
            git commit -m "更新抖音/小红书动态 $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin ${{ github.ref_name }} 2>/dev/null || true
              git push && break || sleep 8
            done
          fi
