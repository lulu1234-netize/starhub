name: 星汇定时采集

on:
  schedule:
    - cron: '*/2 * * * *'       # 每 2 分钟跑一次（用户要求缩短采集延迟；GitHub Actions 定时任务支持 1 分钟粒度，2 分钟是「低延迟 vs 微博机房 IP 限流风险」的折中）
                               # 注：若 Cookie 因此又被微博风控快速失效（机房 IP 限流），
                               # 届时再考虑其它采集方式
  workflow_dispatch:            # 允许在网页上手动点「Run workflow」立刻采集一次

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write          # 允许工作流结束时用 GITHUB_TOKEN 主动再唤起自己（自循环采集）
    # 并发锁：避免定时运行互相踩踏（同时写仓库会互相覆盖）
    concurrency:
      group: starhub-data-write
      cancel-in-progress: false
    env:
      # 采集器内部已按 UTC+8 显式换算，这里再声明一次，
      # 保证提交信息与任何 Date 相关逻辑都落在北京时间
      TZ: Asia/Shanghai
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集微博动态
        env:
          # Cookie 放在仓库 Secrets 里，日志与代码里都看不到
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          # 微信推送（Server酱）是可选的：不配置 SENDKEY 就不会推送，不影响采集
          SENDKEY: ${{ secrets.SENDKEY }}
        run: node collector/collect_http.js

      - name: 提交最新数据
        run: |
          git config user.name "starhub-bot"
          git config user.email "starhub-bot@users.noreply.github.com"
          # 每次运行都留下痕迹，避免仓库长期无活动导致定时任务被 GitHub 自动停用
          echo "{\"at\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}" > data/lastcheck.json
          # data/img 是本地化后的微博图片（采集器下载），存在才提交
          # data/collect_status.json 是采集健康报告（每个账号实时结果），存在才提交
          git add -A data/posts.json data/lastcheck.json data/collect_status.json
          if [ -d data/img ]; then git add -A data/img; fi
          if git diff --staged --quiet; then
            echo "本次没有新内容，跳过提交"
          else
            git commit -m "更新动态 $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin ${{ github.ref_name }} 2>/dev/null || true
              git push && break || sleep 8
            done
          fi

      - name: 链式触发下一轮（每 ~2 分钟自循环）
        # 绕过 GitHub 调度器对高频定时的限速：本轮跑完主动再唤起一次自己，
        # 形成稳定 ~2 分钟采集循环。原生 schedule 仍保留作兜底（链条偶断时几小时后自动重启）。
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run collect.yml
